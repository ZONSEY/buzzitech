<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BUZZITECH ASSISTANCE - Smart Solutions Integrator</title>
  <meta name="description" content="BUZZITECH ASSISTANCE conçoit des solutions intégrées pour protéger vos personnes, vos biens, vos données et assurer la continuité de vos activités.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Applique le thème avant le premier rendu pour éviter un flash
    // (sombre puis clair, ou l'inverse) au chargement de la page.
    (function () {
      try {
        var stored = localStorage.getItem('buzzitech-theme');
        var theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
