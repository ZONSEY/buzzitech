services:

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: buzzitech-api

    restart: unless-stopped

    expose:
        - "3000"

    env_file:
      - ./.env.development

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - buzzitech-network


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: buzzitech-frontend

    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      - api

    networks:
      - buzzitech-network


  postgres:
    image: postgres:17-alpine

    container_name: buzzitech-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: buzzitech
      POSTGRES_USER: buzzitech
      POSTGRES_PASSWORD: buzzitech_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U buzzitech -d buzzitech"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - buzzitech-network


  redis:
    image: redis:7-alpine

    container_name: buzzitech-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    networks:
      - buzzitech-network


  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    container_name: buzzitech-nginx

    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      PORT: 80
      API_HOST: api
      API_PORT: 3000
      FRONTEND_HOST: frontend
      FRONTEND_PORT: 80

    depends_on:
      - api
      - frontend

    networks:
      - buzzitech-network


volumes:

  postgres_data:

  redis_data:


networks:

  buzzitech-network:
    driver: bridge